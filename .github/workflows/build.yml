name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screen-service:
    name: Rust remote services (macOS + Linux)
    runs-on: macos-15
    permissions:
      contents: write # Read the signed payload asset from the release draft.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - name: Build all remote service payloads
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          sh scripts/service-build.sh build-screen --all
          sh scripts/service-build.sh build-agent --all
      - name: Import signed release service payloads
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ARCHIVE="Termish-${GITHUB_REF_NAME#v}-remote-services.tar.gz"
          # The publisher uploads the locally signed archive immediately after
          # pushing the tag. Private signing keys stay on the signing Mac.
          for attempt in $(seq 1 12); do
            if gh release download "$GITHUB_REF_NAME" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP" --clobber; then break; fi
            echo "Waiting for signed payload archive ($attempt/12)"
            sleep 10
          done
          python3 scripts/remote-payloads.py unpack "$RUNNER_TEMP/$ARCHIVE" "$(git rev-parse HEAD)"
          sh scripts/service-build.sh pack-screen
          sh scripts/service-build.sh pack-agent
          python3 scripts/remote-payloads.py verify-macos
      - uses: actions/upload-artifact@v4
        with:
          name: remote-service-payloads
          path: |
            screenService/build/binaries/
            agentBridge/build/binaries/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: checks happen locally; CI only builds and packages. Tag builds build
  # release only; manual runs also leave a debug build available.
  #
  # Official tags must be signed; without secrets configured only manual builds of
  # unsigned self-test artifacts are allowed.
  #   ANDROID_KEYSTORE_BASE64       – base64 content of the signing keystore
  #   ANDROID_KEYSTORE_PASSWORD     – keystore password
  #   ANDROID_KEY_ALIAS             – alias
  #   ANDROID_KEY_PASSWORD          – alias password
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    needs: [screen-service]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - uses: actions/download-artifact@v4
        with:
          name: remote-service-payloads
          path: .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The release tag must match the version in the repo, preventing "tag 0.3.0 but the package is still 0.2.0"
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          if [ "$TAG" != "$VN" ]; then
            echo "::error::tag=$TAG does not match build config (Android versionName=$VN)"
            echo "::error::Run ./scripts/bump-version.sh $TAG and commit first, then re-tag"
            exit 1
          fi
          echo "Versions consistent: Android $TAG"

      # Official tags must never degrade to unsigned artifacts; manual builds may still produce
      # unsigned release artifacts for internal inspection, but they never enter the GitHub Release.
      - name: Verify release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew checkSigningSecrets

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew :composeApp:assembleDebug

      # Release signing: repo secrets are injected as process environment variables; the build
      # script reads them and decodes the base64. Locally it reads the project root .env;
      # the keystore is decoded into build/signing/.
      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease \
            -x :composeApp:lintVitalAnalyzeRelease \
            -x :composeApp:lintVitalReportRelease \
            -x :composeApp:lintVitalRelease

      - name: Verify release artifact signatures
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(find composeApp/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB=$(find composeApp/build/outputs/bundle/release -type f -name '*.aab' -print -quit)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APK" && test -n "$AAB" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # AAB verification: on newer JDKs jarsigner -strict treats the PKIX warning of a self-signed
          # certificate chain as a failure (exit 4, hit on the very first v1.6.4 run) — the release
          # keystore is self-signed by design, so this is expected; while an "unsigned" jar returns 0
          # regardless of strict. So instead:
          # ① assert signature entries exist (META-INF/*.{RSA,DSA,EC} + *.SF are only produced by signing)
          # ② jarsigner output contains verified (unsigned/tampered jars output unsigned/error)
          # Both signature entries are required; either failure must reject the AAB.
          # shellcheck disable=SC2015
          unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)$' \
            && unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.SF$' \
            || { echo "::error::AAB is missing signature entries (unsigned artifacts must not be released)"; exit 1; }
          jarsigner -verify "$AAB" | grep -q "jar verified" \
            || { echo "::error::AAB jarsigner verification failed (tampered/corrupted?)"; exit 1; }

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename release assets with build stamp
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        # Test packages do not bump versionName/versionCode (same-number overwrite installs are
        # allowed, and official releases are unaffected by run_number inflation); the filename
        # carries the run number + short SHA so a download can be traced back to the build that
        # produced it. Tag releases are not renamed: the release job's rename step depends on
        # the original filenames.
        run: |
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          cd composeApp/build/outputs
          STAMP="${VN}-rc${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          for f in apk/release/*.apk bundle/release/*.aab; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/^composeApp-//')
            mv "$f" "$(dirname "$f")/Termish-$STAMP-$name"
          done
          ls apk/release bundle/release

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: only triggered by tags (vX.Y.Z); aggregates Android artifacts to create the
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs git context, so checkout is required
      - uses: actions/checkout@v4

      # Only fetch the Android release artifacts (the debug APK is archived only, not in the Release).
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
          merge-multiple: true

      - name: Rename assets with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          # upload-artifact v4 with multiple paths preserves the apk/, bundle/ directory structure.
          # Collect APK/AAB files and rename them uniformly to the top level with the version.
          while IFS= read -r -d '' f; do
            name=$(basename "$f" | sed "s/^composeApp-//")
            mv "$f" "Termish-$VER-$name"
          done < <(find . -type f \( -name "*.apk" -o -name "*.aab" \) -print0)
          rm -rf apk bundle
          ls -l

      - name: Include signed companion service archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "Termish-${GITHUB_REF_NAME#v}-remote-services.tar.gz" --dir dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          # Preserve the signed service archive staged by the signing Mac.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --draft --generate-notes
          fi
          # Create an empty release first, then upload assets one by one with --clobber: gh release
          # create with assets does not support overwriting assets with the same name (delete +
          # immediately recreate the same-named asset hits uploads service dedup delay → 422
          # ReleaseAsset.name already exists). Uploading per asset is idempotent, and a single
          # asset failure can be re-uploaded on its own.
          for f in dist/*; do
            gh release upload "$TAG" "$f" --clobber
            echo "✅ Uploaded $(basename "$f")"
          done
          gh release edit "$TAG" --draft=false --latest
          echo "✅ Release $TAG done"

  publish-r2:
    name: Sync published release to R2
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-r2.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
